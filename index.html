<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ข้อมูลส่วนตัว</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: 0;
            padding: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            margin: 5px 0;
        }

        ul {
            list-style-position: inside;
            padding: 0;
        }
    </style>
</head>
<body>
    <h1>ฐิติกรณ์ จันทร์นวล</h1>
    <p>อายุ: 20 ปี</p>
    <p>สถานะปัจจุบัน: นักศึกษา</p>
    <h2>งานอดิเรก</h2>
    <ul>
        <li>ฟังเพลง</li>
        <li>เล่นเกม</li>
        <li>เขียนโปรแกรม</li>
    </ul>

</body>
</html>
